services:
  visor-api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      VISOR_DATA_DIR: /data/jobs
      VISOR_WORKERS: "1"
      OMP_NUM_THREADS: "4"
      VISOR_CORS_ORIGINS: "*"
    volumes:
      - visor-data:/data/jobs
    restart: unless-stopped

volumes:
  visor-data:
